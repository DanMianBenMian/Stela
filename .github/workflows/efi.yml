# Builds stela.efi from this branch.
#
# The v0.5.0 release does not carry the laptop-panel fix: PR #184
# ("light a laptop panel driven by the discrete GPU by giving GSP-RM the ACPI
# data") merged after that tag, so a panel behind the discrete GPU needs an
# stela.efi built here. Upstream's ci.yml deliberately builds none; this is
# upstream release.yml's `efi` job without the macOS app it optionally embeds
# (`STELA_APP` absent leaves STELA_APP_PRESENT 0) and without the release
# plumbing.
name: efi

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: efi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  efi:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: Install Clang 21 and the GPU host tools
        run: |
          # The kext needs upstream Clang 21 or newer for arm64e. The Intel
          # and AMD Vulkan drivers' builds run glslangValidator 12.2 or newer
          # and mesa_clc, which links LLVM 21 and libclang-cpp 21 (and the
          # SPIR-V libraries spirv.sh builds below).
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            clang-21 lld-21 llvm-21 llvm-21-dev libclang-21-dev libclang-cpp21-dev \
            glslang-tools ninja-build
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-efi-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/stela-boot/Cargo.lock') }}
          restore-keys: cargo-efi-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustc --version
          version="$(clang --version)"
          echo "${version%%$'\n'*}"
          [[ "$version" =~ version\ (2[1-9]|[3-9][0-9])\. ]] || { echo "::error::clang on PATH is older than 21"; exit 1; }

      - name: Cache keys
        id: keys
        run: |
          pins="$(git ls-tree HEAD third_party | sha256sum | cut -c1-16)"
          llvm="$(clang --version | head -1)"
          tools="$(printf '%s\n%s\n%s\n' "$llvm" "$(rustc --version)" "$(glslangValidator --version | head -1)" | sha256sum | cut -c1-16)"
          echo "nvk=$pins-$tools" >> "$GITHUB_OUTPUT"
          echo "llvm=$(echo "$llvm" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .tools/gpu
          key: gpu-tools-${{ steps.keys.outputs.image }}-${{ hashFiles('xtask/src/gpu/toolchain.rs') }}

      - uses: actions/cache@v4
        id: spirv
        with:
          path: .tools/spirv
          key: spirv-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.llvm }}-${{ hashFiles('.github/spirv.sh') }}

      - name: SPIR-V libraries
        run: |
          if [[ "${{ steps.spirv.outputs.cache-hit }}" != true ]]; then
            bash .github/spirv.sh .tools/spirv
          fi
          echo "PKG_CONFIG_PATH=$PWD/.tools/spirv/lib/pkgconfig" >> "$GITHUB_ENV"

      # Mesa and LLVM compiled for stela.efi. Only an exact key restores: it
      # covers every input of `target/gpu`.
      - uses: actions/cache@v4
        id: nvk
        with:
          path: target/gpu
          key: nvk-${{ steps.keys.outputs.nvk }}-${{ hashFiles('xtask/src/gpu/**', 'crates/stela-driver-gpu/**', 'third_party/patches/**', 'third_party/*.sparse', '.github/spirv.sh') }}

      - name: Fetch upstream sources
        run: cargo xtask gpu fetch

      - name: Build stela.efi
        env:
          STELA_RELEASE: "1"
        run: |
          cargo xtask boot build --release
          echo "Vulkan drivers: $(paste -sd, target/gpu/nvk/vulkan-drivers)" >> "$GITHUB_STEP_SUMMARY"
          efi=target/boot/x86_64-unknown-uefi/release/stela-deploy.efi
          [[ "$(head -c 2 "$efi")" == MZ ]] || { echo "::error::$efi is not a PE image"; exit 1; }
          mkdir -p dist
          cp "$efi" dist/stela.efi
          ls -l dist/stela.efi
          { echo "stela.efi: $(stat -c %s dist/stela.efi) bytes"; echo "sha256 $(sha256sum dist/stela.efi | cut -d' ' -f1)"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: stela-efi
          path: dist/stela.efi
          if-no-files-found: error
          retention-days: 30

  # The CLI embeds the stela.efi built above, exactly as release.yml's `cli` job
  # does, so the two always match. Only the Windows target is built: this fork
  # exists to set up a Windows PC.
  cli:
    needs: [efi]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Put LLVM on PATH
        run: |
          # The C build passes --no-default-config, which Clang 16 and newer
          # take.
          echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-cli-windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-cli-windows-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          # stela-tls compiles Mbed TLS with clang on every host, and archives
          # it with llvm-lib for Windows.
          for tool in clang llvm-lib; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on PATH"; exit 1; }
          done
          clang --version | head -1

      - uses: actions/download-artifact@v4
        with:
          name: stela-efi
          path: efi

      - name: Build stela
        run: |
          export STELA_EFI="$PWD/efi/stela.efi"
          cargo build --release --locked -p stela-cli --target x86_64-pc-windows-msvc
          mkdir -p stela-windows-x86_64
          cp target/x86_64-pc-windows-msvc/release/stela.exe stela-windows-x86_64/

      - uses: actions/upload-artifact@v4
        with:
          name: stela-windows-x86_64
          path: stela-windows-x86_64/
          if-no-files-found: error
